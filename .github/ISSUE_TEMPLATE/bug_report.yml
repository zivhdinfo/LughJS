name: Bug report
description: Something behaves differently from what the documentation says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. Use the
        [private advisory form](https://github.com/zivhdinfo/LughJS/security/advisories/new)
        instead, as described in [SECURITY.md](https://github.com/zivhdinfo/LughJS/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: |
        The smallest thing that shows the problem. A route, a config file and the
        request you sent is usually enough. `lugh new` plus the steps you took
        after it is ideal, because it starts from a state everyone shares.
      placeholder: |
        1. lugh new repro --language=ts --database=sqlite --yes
        2. add this route to start/routes.ts
        3. curl localhost:3000/...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: |
        The error, the response body, or the log lines. Run the failing command
        with `LUGH_DEBUG=1` to get a stack trace.
      render: text

  - type: input
    id: version
    attributes:
      label: "@lughjs/core version"
      description: The output of `lugh --version`.
      placeholder: "2.0.0"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: The output of `node -v`.
      placeholder: "v22.11.0"
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Project language
      options:
        - TypeScript
        - JavaScript
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite
        - PostgreSQL
        - MySQL or MariaDB
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, Ubuntu 24.04, macOS 15, node:22-slim container"
    validations:
      required: true
